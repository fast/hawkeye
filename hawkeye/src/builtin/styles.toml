[styles.slash_line]
kind = "line"
prefix = "// "

[styles.triple_slash_line]
kind = "line"
prefix = "/// "

[styles.hash_line]
kind = "line"
prefix = "# "

[styles.dash_line]
kind = "line"
prefix = "-- "

[styles.percent_line]
kind = "line"
prefix = "% "

[styles.percent3_line]
kind = "line"
prefix = "%%% "

[styles.semicolon_line]
kind = "line"
prefix = "; "

[styles.apostrophe_line]
kind = "line"
prefix = "' "

[styles.bang_line]
kind = "line"
prefix = "! "

[styles.bang3_line]
kind = "line"
prefix = "!!! "

[styles.tilde2_line]
kind = "line"
prefix = "~~ "

[styles.rem_line]
kind = "line"
prefix = "@REM "

[styles.haml_line]
kind = "line"
prefix = "-# "

[styles.xml_line]
kind = "line"
prefix = "<!-- "
suffix = " -->"
pad_lines = true

[styles.slash_block]
kind = "block"
start = "/*"
prefix = " * "
end = " */"

[styles.javadoc_block]
kind = "block"
start = "/**"
prefix = " * "
end = " */"

[styles.xml_block]
kind = "block"
start = "<!--"
prefix = "    "
end = "-->"

[styles.lua_block]
kind = "block"
start = "--[["
prefix = "    "
end = "]]"

[styles.brace_star_block]
kind = "block"
start = "{*"
prefix = " * "
end = " *}"

[styles.hash_star_block]
kind = "block"
start = "#*"
prefix = " * "
end = " *#"

[styles.mustache_block]
kind = "block"
start = "{{!"
prefix = "    "
end = "}}"

[styles.mvel_block]
kind = "block"
start = "@comment{"
prefix = "  "
end = "}"

[styles.freemarker_block]
kind = "block"
start = "<#--"
prefix = "    "
end = "-->"

[styles.freemarker_alt_block]
kind = "block"
start = "[#--"
prefix = "    "
end = "--]"

[styles.jsp_block]
kind = "block"
start = "<%--"
prefix = "    "
end = "--%>"

[styles.coldfusion_block]
kind = "block"
start = "<!---"
prefix = "    "
end = "--->"

[styles.asp_block]
kind = "block"
start = "<%"
prefix = "' "
end = "%>"

[styles.swift_banner]
kind = "block"
start = "//===----------------------------------------------------------------------===//"
prefix = "// "
end = "//===----------------------------------------------------------------------===//"

[styles.asciidoc_block]
kind = "block"
start = "////"
prefix = "// "
end = "////"
