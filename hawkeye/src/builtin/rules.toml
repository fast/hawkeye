[[rules]]
extensions = [
  "as",
  "aj",
  "c",
  "cc",
  "cpp",
  "cs",
  "css",
  "go",
  "gradle",
  "groovy",
  "h",
  "hh",
  "hpp",
  "java",
  "fx",
  "js",
  "cjs",
  "jsx",
  "kt",
  "kts",
  "proto",
  "scala",
  "scss",
  "ts",
  "tsx",
  "v",
  "sv",
]
style_out = "slashstar"
styles_in = ["slashstar", "doubleslash"]

[[rules]]
extensions = ["mbt", "rs", "zig"]
filenames = ["go.mod"]
style_out = "doubleslash"
styles_in = ["doubleslash", "slashstar"]

[[rules]]
extensions = [
  "pl",
  "pm",
  "properties",
  "py",
  "pyi",
  "rb",
  "sh",
  "toml",
  "yaml",
  "yml",
]
filenames = [
  ".editorconfig",
  "CMakeLists.txt",
  "Containerfile",
  "Dockerfile",
  "Makefile",
]
style_out = "script"

[[rules]]
extensions = ["adb", "ads", "e", "sql"]
style_out = "doubledashes"

[[rules]]
extensions = [
  "fml",
  "dtd",
  "gsp",
  "htm",
  "html",
  "jspx",
  "kml",
  "mxml",
  "pom",
  "svelte",
  "tagx",
  "tld",
  "vue",
  "wsdl",
  "xhtml",
  "xml",
  "xsd",
  "xsl",
  "xslt",
]
style_out = "xml"
styles_in = ["xml", "xml_per_line"]

[[rules]]
extensions = ["asm", "clj", "cljs", "el"]
style_out = "semicolon"

[[rules]]
extensions = ["f"]
style_out = "exclamation"

[[rules]]
extensions = ["erl", "hrl"]
style_out = "percent3"

[[rules]]
extensions = ["cls", "sty", "tex"]
style_out = "percent"

[[rules]]
extensions = ["bas", "vba"]
style_out = "apostrophe"

[[rules]]
extensions = ["bat", "cmd"]
style_out = "batch"

[[rules]]
extensions = ["pas"]
style_out = "bracesstar"

[[rules]]
extensions = ["vm"]
style_out = "sharpstar"

[[rules]]
extensions = ["mustache"]
style_out = "mustache"

[[rules]]
extensions = ["mv"]
style_out = "mvel"

[[rules]]
extensions = ["ftl"]
style_out = "ftl"
styles_in = ["ftl", "ftl_alt"]

[[rules]]
extensions = ["jsp"]
style_out = "dynascript"

[[rules]]
extensions = ["cfc", "cfm"]
style_out = "dynascript3"

[[rules]]
extensions = ["asp"]
style_out = "asp"

[[rules]]
extensions = ["php"]
style_out = "slashstar"
styles_in = ["slashstar", "doubleslash"]

[[rules]]
extensions = ["lua"]
style_out = "lua"

[[rules]]
extensions = ["adoc"]
style_out = "asciidoc"

[[rules]]
extensions = ["pkl"]
filenames = ["PklProject"]
style_out = "line_block"
styles_in = ["line_block", "doubleslash"]

[[rules]]
extensions = ["haml", "scaml"]
style_out = "haml"

[[rules]]
extensions = ["apt"]
style_out = "doubletilde"
