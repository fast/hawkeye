name: Docker

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

concurrency:
  # Cancel superseded runs for one PR without letting branch or tag pushes cancel one another.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  amd64:
    name: Build amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - name: Build image for pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hawkeye:test-amd64
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-amd64
      - name: Test image
        if: ${{ github.event_name == 'pull_request' }}
        run: docker run --rm hawkeye:test-amd64 --version
      - name: Build and push image by digest
        if: ${{ github.event_name == 'push' }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

  arm64:
    name: Build arm64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - name: Build image for pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: hawkeye:test-arm64
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-arm64
      - name: Test image
        if: ${{ github.event_name == 'pull_request' }}
        run: docker run --rm hawkeye:test-arm64 --version
      - name: Build and push image by digest
        if: ${{ github.event_name == 'push' }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-arm64
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

  publish:
    name: Publish image
    if: ${{ github.event_name == 'push' }}
    needs: [ amd64, arm64 ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{raw}}
      - name: Push manifest
        env:
          AMD64_DIGEST: ${{ needs.amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.arm64.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "${REGISTRY_IMAGE}@${AMD64_DIGEST}" \
            "${REGISTRY_IMAGE}@${ARM64_DIGEST}"
