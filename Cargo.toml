[package]
name = "hawkeye"
version = "7.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
authors = ["FastLabs Developers"]
description = "A library and command-line tool for checking and rewriting license headers."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/korandoru/hawkeye"
documentation = "https://docs.rs/hawkeye"
keywords = ["license", "header", "formatter", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "tests/**",
    "docs/**",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "deny.toml",
    "hawkeye.toml",
]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:serde_json", "dep:similar"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
globset = { version = "0.4.20", default-features = false }
ignore = "0.4.33"
minijinja = { version = "2.22", default-features = false, features = ["builtins", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
similar = { version = "3.1", optional = true }
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"

[lib]
name = "hawkeye"
path = "src/lib.rs"

[[bin]]
name = "hawkeye"
path = "src/bin/hawkeye.rs"
required-features = ["cli"]

[lints.rust]
missing_docs = "deny"
unknown_lints = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"

[profile.release]
lto = "thin"

[package.metadata.docs.rs]
all-features = true
