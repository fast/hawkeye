[build-system]
build-backend = "maturin"
requires = ["maturin>=1.14,<2"]

[project]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]
description = "A license header checker and formatter."
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "hawkeye-license"
readme = "README.md"
requires-python = ">=3.9"

[project.urls]
Documentation = "https://docs.rs/hawkeye"
Repository = "https://github.com/korandoru/hawkeye"

[tool.maturin]
bindings = "bin"
features = ["application"]
locked = true
manifest-path = "hawkeye/Cargo.toml"
strip = true
