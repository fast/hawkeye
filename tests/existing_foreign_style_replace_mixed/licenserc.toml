baseDir = "."
headerPath = "Apache-2.0.txt"

includes = ["*.rs"]
excludes = ["*.expected"]

# `.rs` prefers DOUBLESLASH; a SLASHSTAR header is accepted for removal. A file may stack a
# block in each style; format must strip BOTH and leave exactly one preferred header (#210).
[[headers]]
extensions = ["rs"]
styles = ["DOUBLESLASH_STYLE", "SLASHSTAR_STYLE"]
existingStrategy = "replace"

[properties]
inceptionYear = 2023
copyrightOwner = "The CopyrightOwner"
