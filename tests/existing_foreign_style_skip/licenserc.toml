baseDir = "."
headerPath = "Apache-2.0.txt"

includes = ["*.rs"]
excludes = ["*.expected"]

# An existing header (any style) is left untouched and reported, never duplicated.
[[headers]]
extensions = ["rs"]
styles = ["DOUBLESLASH_STYLE", "SLASHSTAR_STYLE"]
existingStrategy = "skip"

[properties]
inceptionYear = 2023
copyrightOwner = "The CopyrightOwner"
