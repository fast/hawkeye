baseDir = "."
headerPath = "Apache-2.0.txt"

includes = ["*.rs"]
excludes = ["*.expected"]

# `.rs` prefers DOUBLESLASH; a SLASHSTAR header is accepted for removal so it migrates
# instead of being duplicated.
[[headers]]
extensions = ["rs"]
styles = ["DOUBLESLASH_STYLE", "SLASHSTAR_STYLE"]
existingStrategy = "replace"

[properties]
inceptionYear = 2023
copyrightOwner = "The CopyrightOwner"
