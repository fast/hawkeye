baseDir = "."
headerPath = "Apache-2.0.txt"

includes = ["*.rs"]
excludes = ["*.expected"]

# The word-boundary fix: `copyright` appears only inside the identifier `copyrightHolder`, which
# is NOT a license notice, so the file is treated as header-less and gets the preferred header.
[[headers]]
extensions = ["rs"]
styles = ["DOUBLESLASH_STYLE"]
existingStrategy = "replace"

[properties]
inceptionYear = 2023
copyrightOwner = "The CopyrightOwner"
